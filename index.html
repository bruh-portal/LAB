<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10172c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:white}.stage{position:fixed;inset:0;overflow:hidden;background:#11172a}.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .65s ease}.scene.active{opacity:1;visibility:visible}.art{width:100%;height:100%;display:block}.outZoom{transform-box:fill-box;transform-origin:50% 70%;animation:cameraIn 2.2s cubic-bezier(.18,.75,.2,1) forwards}@keyframes cameraIn{to{transform:scale(1.42)}}.doorLeaf{transform-box:fill-box;transform-origin:left center;transition:transform .8s}.doorLeaf.open{transform:perspective(300px) rotateY(-65deg)}.bubble{position:absolute;z-index:5;top:max(16px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-10px);width:min(760px,92vw);padding:12px 17px;border:2px solid #f8e4c6;border-radius:17px;background:#fff8ea;color:#273346;text-align:center;font-weight:750;font-size:clamp(.95rem,2.4vw,1.22rem);line-height:1.32;box-shadow:0 7px 24px #070c1b95;opacity:0;transition:.3s}.bubble.show{opacity:1;transform:translate(-50%,0)}.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;width:15px;height:15px;background:#fff8ea;border-right:2px solid #f8e4c6;border-bottom:2px solid #f8e4c6;transform:translateX(-50%) rotate(45deg)}.action{position:absolute;z-index:6;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);border:2px solid #f9e7c9;border-radius:13px;background:#18243de8;color:white;padding:12px 23px;font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 6px 24px #0008}.choices{position:absolute;z-index:6;left:50%;bottom:max(17px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;justify-content:center;flex-wrap:wrap;gap:7px;width:min(850px,97vw);padding:9px;border-radius:15px;border:1px solid #ffffff65;background:#101a2fe8;backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.3s}.choices.show{opacity:1;pointer-events:auto}.choice{min-width:clamp(58px,10vw,98px);padding:10px 12px;border:2px solid #ffffffc9;border-radius:11px;font-weight:900;font-size:clamp(.78rem,1.8vw,.96rem);color:#162033;cursor:pointer;box-shadow:0 3px 10px #0007;transition:transform .15s,outline .15s}.choice:hover{transform:translateY(-3px)}.choice.sel{outline:3px solid #fff;box-shadow:0 0 18px #fff}.bubble svg{vertical-align:middle}.impact{position:fixed;z-index:20;inset:0;display:none;overflow:hidden;background:#10131f}.impact.go{display:block;animation:bgflash .48s ease-out both}@keyframes bgflash{0%{background:#fff0c3}25%{background:#f68a35}100%{background:#161923}}.flare{position:absolute;left:50%;top:50%;width:70vmax;height:70vmax;transform:translate(-50%,-50%) scale(.015);opacity:0;background:radial-gradient(circle,#fffbe1 0 5%,#fff0a1 10%,#ffbd47 22%,#ff7132 37%,#e64732 51%,#8a3a52 64%,transparent 68%);clip-path:polygon(50% 0,56% 15%,68% 4%,70% 23%,91% 12%,81% 32%,100% 40%,82% 49%,99% 61%,79% 67%,90% 89%,68% 79%,59% 100%,49% 81%,34% 98%,32% 77%,10% 89%,22% 65%,0 56%,20% 46%,3% 27%,27% 31%,31% 6%,44% 22%);filter:drop-shadow(0 0 40px #ff8a33)}.impact.go .flare{animation:flare .9s cubic-bezier(.13,.78,.18,1) both}@keyframes flare{0%{opacity:0;transform:translate(-50%,-50%) scale(.015) rotate(-10deg)}14%{opacity:1}50%{opacity:1;transform:translate(-50%,-50%) scale(1.5) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.25) rotate(14deg)}}.ring{position:absolute;left:50%;top:50%;width:10vmin;height:10vmin;border:clamp(5px,1vw,16px) solid #fff5c8;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.05);box-shadow:0 0 25px #ffa34c}.impact.go .ring{animation:ring .9s .07s ease-out both}@keyframes ring{to{opacity:0;transform:translate(-50%,-50%) scale(14)}}.smoke{position:absolute;inset:-18%;z-index:2;opacity:0;transform:scale(.3);filter:blur(13px);background:radial-gradient(ellipse at 50% 50%,#ede5d5 0 9%,transparent 24%),radial-gradient(ellipse at 32% 59%,#c6c9ce 0 15%,transparent 33%),radial-gradient(ellipse at 68% 58%,#d8d4d0 0 17%,transparent 36%),radial-gradient(ellipse at 52% 32%,#b9c2ca 0 16%,transparent 35%),radial-gradient(ellipse at 20% 40%,#9ba9b8 0 14%,transparent 33%),radial-gradient(ellipse at 80% 38%,#c1c7ca 0 15%,transparent 34%);background-color:#303743}.impact.go .smoke{animation:smoke 1.5s .38s cubic-bezier(.16,.7,.2,1) forwards}@keyframes smoke{0%{opacity:0;transform:scale(.3);filter:blur(23px)}38%{opacity:.96;transform:scale(1.2);filter:blur(12px)}100%{opacity:.99;transform:scale(1.8);filter:blur(15px)}}.impact.done .smoke{opacity:.99;transform:scale(1.8)}.impact.done .flare{opacity:0}.handGroup{transform-box:view-box;transform-origin:0 0;transition:transform .7s cubic-bezier(.2,.8,.2,1)}.handGroup.pour{transform:translate(150px,-86px) rotate(37deg)}.liquidStream{opacity:0;stroke-dasharray:1;stroke-dashoffset:1}.liquidStream.go{opacity:1;animation:pour .72s .42s ease-out forwards}@keyframes pour{to{stroke-dashoffset:0}}.liquidSurface{transition:fill .2s}.soundToggle{position:absolute;right:14px;top:14px;z-index:7;background:#111a2ec9;border:1px solid #fff8;border-radius:9px;padding:8px 10px;color:white;font-size:.82rem;cursor:pointer}.hidden{display:none!important}@media(max-width:600px){.choices{gap:4px;padding:7px 4px;width:99vw}.choice{min-width:55px;padding:9px 4px;font-size:.76rem}.bubble{top:5%;width:94vw;padding:10px 12px}.action{bottom:15px}}

dth="6"/><ellipse cx="513" cy="239" rx="6" ry="9" fill="#29364b"/><ellipse cx="609" cy="239" rx="6" ry="9" fill="#29364b"/><path d="M541 278q32 23 65 0" fill="none" stroke="#b26465" stroke-width="5" stroke-linecap="round"/><path d="M452 309q-42 4-61 50l-29 76q-10 29 13 37 22 7 34-20l37-69m254-71q43 7 58 48l29 77q10 29-13 37-22 7-34-20l-37-69" fill="url(#coat)" stroke="#8194a5" stroke-width="7"/><circle cx="425" cy="419" r="15" fill="#edc7a4"/><circle cx="746" cy="419" r="15" fill="#edc7a4"/><path d="M516 181q62 16 127-8" fill="none" stroke="#75859a" stroke-width="4" opacity=".7"/><g fill="#efd18c"><circle cx="280" cy="321" r="5"/><circle cx="370" cy="200" r="4"/><circle cx="770" cy="307" r="4"/></g></svg><div class="bubble" id="helloBubble">Hola, bienvenido. ¿Me ayudas con mi experimento?</div></section>

th="38" height="68" rx="12" fill="#409fff"/><rect x="-10" y="-42" width="20" height="16" rx="3" fill="#dbe7e5"/><path d="M-14 2h28v30h-28z" fill="#7cc5ff" opacity=".8"/></g><g transform="translate(421 276)"><rect x="-19" y="-30" width="38" height="68" rx="12" fill="#ed5364"/><rect x="-10" y="-42" width="20" height="16" rx="3" fill="#dbe7e5"/><path d="M-14 2h28v30h-28z" fill="#ff98a3" opacity=".8"/></g><g transform="translate(484 276)"><rect x="-19" y="-30" width="38" height="68" rx="12" fill="#4dca83"/><rect x="-10" y="-42" width="20" height="16" rx="3" fill="#dbe7e5"/><path d="M-14 2h28v30h-28z" fill="#9ce7b6" opacity=".8"/></g><g transform="translate(547 276)"><rect x="-19" y="-30" width="38" height="68" rx="12" fill="#ad70e6"/><rect x="-10" y="-42" width="20" height="16" rx="3" fill="#dbe7e5"/><path d="M-14 2h28v30h-28z" fill="#d6aaff" opacity=".8"/></g><g transform="translate(610 276)"><rect x="-19" y="-30" width="38" height="68" rx="12" fill="#f49a3c"/><rect x="-10" y="-42" width="20" height="16" rx="3" fill="#dbe7e5"/><path d="M-14 2h28v30h-28z" fill="#ffd099" opacity=".8"/></g></g><!-- large receiving flask --> <path d="M688 89v94l-101 110q-18 23 22 25h218q40-2 22-25L748 183V89z" fill="url(#glass)" stroke="#eaf4f0" stroke-width="11"/><path d="M675 79h87v19h-87z" fill="#e8f3ec" stroke="#fff" stroke-width="4"/><path id="beakerFill" d="M608 279l83-92h51l82 92q9 18-18 19H625q-27-1-17-19z" fill="url(#selectedLiquid)" opacity=".88"/><g id="bubbles" fill="#f8ffff" opacity="0"><circle cx="686" cy="264" r="8"/><circle cx="724" cy="244" r="7"/><circle cx="750" cy="267" r="6"/></g><!-- first-person sleeve and hand with a vial --><path d="M0 562q57-137 191-176l140 68-67 108z" fill="#25334d"/><path d="M25 562q66-103 177-139l97 47-62 92z" fill="#f5eee2" stroke="#9caab2" stroke-width="6"/><g id="hand" transform="translate(278 426)"><path d="M-37 136q17-66 75-99l44-35q20-16 35 3 12 16-5 33l-22 21 64-41q20-13 33 6 11 18-8 31l-48 34 67-21q23-7 29 15 6 20-17 27l-63 21h51q24 0 24 24v12H-37z" fill="#f6eee3" stroke="#9caab2" stroke-width="6"/><g id="heldBottle" transform="translate(93 4) rotate(-31)"><rect x="-22" y="-46" width="44" height="20" rx="4" fill="#e9eee9" stroke="#9caab2" stroke-width="4"/><path d="M-19-26h38v72q0 17-19 17t-19-17z" fill="#eff9f6" fill-opacity=".72" stroke="#e4f0eb" stroke-width="5"/><path id="heldLiquid" d="M-14 10h28v34q-14 9-28 0z" fill="#409fff"/></g></g><path id="stream" d="M365 404Q512 314 676 248" fill="none" stroke="#409fff" stroke-width="17" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1" opacity="0"/></svg><div class="bubble show" id="povBubble">Toma, aquí tienes cinco pociones. Elige la que quieras y échala en el matraz.</div><div class="choices" id="choices"></div></section>

</main><script>
const $=s=>document.querySelector(s);const options=[['Azul','#399bf5'],['Roja','#ec5265'],['Verde','#55d88a'],['Morada','#a66de0'],['Naranja','#f4943b']];let phase='outside',voiceOn=true,chosen=null;
function bubbleVoice(text){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.9;u.pitch=.96;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));u.voice=voices.find(v=>/natural|neural|google|microsoft/i.test(v.name))||voices.find(v=>v.lang.toLowerCase()==='es-es')||voices[0]||null;speechSynthesis.speak(u)}
function showScene(id){document.querySelectorAll('.scene').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
function start(){if(phase!=='outside')return;phase='approach';$('#enter').disabled=true;$('#exteriorArt').classList.add('outZoom');setTimeout(()=>$('#doorLeaf').classList.add('open'),950);setTimeout(()=>{showScene('scientistScene');phase='talk';const line='Hola, bienvenido. ¿Me ayudas con mi experimento?';$('#helloBubble').textContent=line;$('#helloBubble').classList.add('show');bubbleVoice(line)},1900);setTimeout(()=>{if(phase!=='talk')return;showScene('povScene');phase='choose';$('#helloBubble').classList.remove('show');const line='Toma, aquí tienes cinco pociones. Elige la que quieras y échala en el matraz.';$('#povBubble').classList.add('show');bubbleVoice(line);$('#choices').classList.add('show')},6000)}
function makeChoices(){options.forEach(([name,color])=>{const b=document.createElement('button');b.className='choice';b.textContent=name;b.style.background=color;b.onclick=()=>pour(name,color,b);$('#choices').appendChild(b)})}
function pour(name,color,button){if(phase!=='choose')return;phase='pouring';chosen={name,color};document.querySelectorAll('.choice').forEach(b=>b.classList.remove('sel'));button.classList.add('sel');$('#heldLiquid').setAttribute('fill',color);$('#stream').setAttribute('stroke',color);$('#liquidA').setAttribute('stop-color',color);$('#liquidB').setAttribute('stop-color',color);$('#choices').classList.remove('show');$('#povBubble').textContent=`Has elegido la poción ${name.toLowerCase()}. La echas en el matraz.`;$('#hand').classList.add('pour');$('#stream').style.transition='opacity .15s';setTimeout(()=>{if(phase==='pouring'){$('#stream').style.opacity='1';$('#stream').style.animation='pour .72s ease-out forwards'}},300);setTimeout(()=>{$('#bubbles').style.opacity='.95'},850);bubbleVoice(`Has elegido la poción ${name.toLowerCase()}.`);setTimeout(()=>{if(phase!=='pouring')return;phase='explosion';if('speechSynthesis'in window)speechSynthesis.cancel();$('#impact').classList.add('go');setTimeout(()=>{if(phase==='explosion'){phase='smoke';$('#impact').classList.add('done')}},1700)},2200)}
makeChoices();$('#enter').addEventListener('click',start);$('#soundToggle').addEventListener('click',()=>{voiceOn=!voiceOn;$('#soundToggle').textContent=voiceOn?'🔊 Voz':'🔇 Voz';if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel()});
</script></body></html>
