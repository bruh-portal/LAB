}}.rays{position:absolute;inset:-10%;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,#fff1b6d9 0 1deg,transparent 1.5deg 14deg);mask-image:radial-gradient(circle,transparent 0 7%,#000 30% 100%)}.impact.active .rays{animation:rays .85s ease-out both}@keyframes rays{0%{opacity:0;transform:scale(.2) rotate(-3deg)}35%{opacity:.94}100%{opacity:0;transform:scale(1.2) rotate(12deg)}}.smoke{position:absolute;z-index:3;inset:-20%;opacity:0;transform:scale(.24);filter:blur(14px);background:radial-gradient(ellipse at 50% 51%,#ede8df 0 10%,transparent 26%),radial-gradient(ellipse at 31% 58%,#c6c9ce 0 16%,transparent 35%),radial-gradient(ellipse at 68% 59%,#dbd6d1 0 18%,transparent 37%),radial-gradient(ellipse at 50% 30%,#bfc7cc 0 17%,transparent 36%),radial-gradient(ellipse at 18% 40%,#a7b2bf 0 14%,transparent 33%),radial-gradient(ellipse at 82% 39%,#c5c9cc 0 15%,transparent 34%);background-color:#343946}.impact.active .smoke{animation:smoke 1.55s .34s cubic-bezier(.16,.7,.2,1) forwards}@keyframes smoke{0%{opacity:0;transform:scale(.24);filter:blur(23px)}38%{opacity:.97;transform:scale(1.14);filter:blur(12px)}100%{opacity:.99;transform:scale(1.7);filter:blur(15px)}}.impact.done .smoke{opacity:.99;transform:scale(1.7)}.impact.done .blast,.impact.done .rays{opacity:0}.sound{position:absolute;z-index:10;top:12px;right:12px;border:1px solid #ffffff88;border-radius:9px;padding:8px 10px;background:#101c32d9;color:white;cursor:pointer}@media(max-width:600px){.choices{width:99vw;padding:7px 4px;gap:4px}.choice{min-width:55px;padding:9px 4px;font-size:.76rem}.bubble{top:5%;width:94vw;padding:10px 12px}.btn{bottom:15px}}

<div class="impact" id="impact"><div class="rays"></div><div class="blast"></div><div class="smoke"></div></div><button class="sound" id="sound">🔊 Voz</button></main>
<script>
const $=s=>document.querySelector(s),options=[['Azul','#3997df'],['Roja','#dd5661'],['Verde','#55ad78'],['Morada','#9c70c9'],['Naranja','#e39445']];let phase='outside',voice=true;
function scene(id){document.querySelectorAll('.scene').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
function say(t){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.9;u.pitch=.96;let vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));u.voice=vs.find(v=>/natural|neural|google|microsoft/i.test(v.name))||vs.find(v=>v.lang.toLowerCase()==='es-es')||vs[0]||null;speechSynthesis.speak(u)}
function start(){if(phase!=='outside')return;phase='entering';$('#reference').style.transform='scale(1.13)';$('#enter').disabled=true;setTimeout(()=>scene('labScene'),700);setTimeout(()=>{if(phase!=='entering')return;phase='hello';$('#hello').classList.add('show');say('Hola, ¿me ayudas con este experimento?')},1450);setTimeout(()=>{if(phase!=='hello')return;scene('povScene');phase='choose';$('#hello').classList.remove('show');$('#instruction').classList.add('show');say('Toma, aquí tienes cinco pociones. Elige la que quieras y échala en el matraz.');$('#choices').classList.add('show')},4300)}
function build(){options.forEach(([name,color],i)=>{let b=document.createElement('button');b.className='choice';b.textContent=name;b.style.background=color;b.onclick=()=>choose(name,color,i,b);$('#choices').appendChild(b)})}
function choose(name,color,index,button){if(phase!=='choose')return;phase='pouring';document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));button.classList.add('sel');$('#choices').classList.remove('show');$('#handFluid').setAttribute('fill',color);$('#pourStream').setAttribute('stroke',color);$('#fillA').setAttribute('stop-color',color);$('#fillB').setAttribute('stop-color',color);$('#bottle').classList.add('pouring');$('#instruction').textContent=`Has elegido la poción ${name.toLowerCase()}. La viertes en el matraz.`;$('#instruction').classList.add('show');say(`Has elegido la poción ${name.toLowerCase()}.`);setTimeout(()=>{if(phase!=='pouring')return;$('#pourStream').classList.add('go')},280);setTimeout(()=>$('#bubbles').classList.add('go'),800);setTimeout(()=>{if(phase!=='pouring')return;phase='explosion';if('speechSynthesis'in window)speechSynthesis.cancel();$('#impact').classList.add('active');setTimeout(()=>{if(phase==='explosion'){phase='done';$('#impact').classList.add('done')}},1800)},2200)}
$('#enter').addEventListener('click',start);$('#sound').addEventListener('click',()=>{voice=!voice;$('#sound').textContent=voice?'🔊 Voz':'🔇 Voz';if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel()});build();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&phase==='done')location.reload()});
</script></body></html>
